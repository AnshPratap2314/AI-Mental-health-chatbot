name: ai-mental-health-chatbot

services:
  mindcare-api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: mindcare-api

    environment:
      API_PUBLIC_URL: "http://127.0.0.1:8001"
      CHAT_RATE_LIMIT: "30"
      CHAT_RATE_LIMIT_BURST: "30"
      DEBUG: "false"
      ENABLE_LLM: "True"
      ENVIRONMENT: "production"
      FRONTEND_URLS: "http://localhost:5500,http://127.0.0.1:5500,http://localhost:5501,http://127.0.0.1:5501"
      MAX_MEMORY: "20"
      MAX_MESSAGE_LENGTH: "4000"
      MAX_SESSIONS: "1000"
      MINDCARE_AUDIT_API_KEY: "${MINDCARE_AUDIT_API_KEY:?Set MINDCARE_AUDIT_API_KEY in .env}"
      MINDCARE_AUDIT_FILE: "/app/logs/safety_audit.jsonl"
      MINDCARE_AUDIT_MAX_RECORDS: "1000"
      MINDCARE_LOG_DIR: "/app/logs"
      PORT: "8000"
      SESSION_RATE_LIMIT: "10"
      SESSION_RATE_LIMIT_BURST: "10"
      SESSION_TTL_SECONDS: "7200"

    ports:
      - "8001:8000"

    restart: unless-stopped

    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
